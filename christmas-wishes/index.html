#yaloka-christmas-preview .tab[aria-selected=true]{background:linear-gradient(#fff1bd,#f7ce75);color:#83282a;border-color:#fff3bc;box-shadow:0 0 12px #f2be5c66,inset 0 -3px #dca34b}
#yaloka-christmas-preview .panel{margin:14px 10px 0;padding:19px 12px 17px;border:2px solid #d2ad6a;border-radius:17px;background:repeating-linear-gradient(45deg,#ffffff02 0 2px,transparent 2px 15px),#a62d33;position:relative;box-shadow:inset 0 0 0 3px #701c29}
#yaloka-christmas-preview .panel:before{content:&#x27;&#x27;;position:absolute;left:5px;right:5px;top:-5px;height:10px;background:#fff8ed;border-radius:60% 35% 45% 40%;box-shadow:12px 5px 0 -2px #fff8ed;pointer-events:none}
#yaloka-christmas-preview h2{color:#ffe3a2;font-size:25px;text-shadow:0 2px #78222c}
#yaloka-christmas-preview .sub{color:#f5d3b1;font-size:11px;margin-bottom:15px}
#yaloka-christmas-preview .tree-stage{height:280px;border-radius:12px;background-image:linear-gradient(#092c3a00 70%,#173b34a6),var(--christmas-scene);background-size:auto 340px;background-position:center 75%;margin:13px 0 0;box-shadow:inset 0 0 0 2px #d4b56d80;overflow:hidden}
#yaloka-christmas-preview .tree{width:240px;height:250px;filter:none;transform:translateY(0)}
#yaloka-christmas-preview .tree .branch,#yaloka-christmas-preview .tree .star,#yaloka-christmas-preview .tree .gift{display:none}
#yaloka-christmas-preview .ornament{opacity:.35;color:#fff6dc;font-size:19px;text-shadow:0 0 5px #234a3a;background:#163e3766;line-height:26px;width:26px;text-align:center;border-radius:50%;border:1px solid #d0a668}
#yaloka-christmas-preview .ornament.lit{opacity:1;color:#fff1a1;background:#c69236;box-shadow:0 0 17px #ffdd8d;text-shadow:0 1px #a64224}
#yaloka-christmas-preview .round{z-index:1;left:10px;top:10px;color:#fff1b7;background:#6b252cbf;border-radius:15px;padding:4px 12px;font-size:11px;letter-spacing:1px}
#yaloka-christmas-preview .stats{padding:13px 10px 12px;background:#741d2c;border-radius:0 0 11px 11px;margin-bottom:17px}
#yaloka-christmas-preview .small{color:#eed4b2;font-size:11px}
#yaloka-christmas-preview .number{color:#fff0b5;font:30px Georgia,serif}
#yaloka-christmas-preview .meter{background:#4c1925;height:9px;margin:10px 0 8px;box-shadow:inset 0 1px 2px #210a14}
#yaloka-christmas-preview .meter span{background:linear-gradient(90deg,#277d5c,#67c08a)}
#yaloka-christmas-preview .rewards{gap:7px}
#yaloka-christmas-preview .reward{background:#7c2230;border-color:#c69758;border-radius:10px;padding:9px 4px;color:#fff0ce;box-shadow:inset 0 1px #efc99544}
#yaloka-christmas-preview .reward.done{background:#275a46;border-color:#e9ce82}
#yaloka-christmas-preview .reward .ico{background:#f6e0ae;border:2px solid #d9b76b;box-shadow:0 3px #571a25;border-radius:12px;width:49px;height:49px;line-height:43px;margin:4px auto 9px;color:#267348;font-size:27px}
#yaloka-christmas-preview .reward b{min-height:32px;line-height:1.35;font-size:11px}
#yaloka-christmas-preview .reward .value{color:#ffe3a2;font-size:11px}
#yaloka-christmas-preview .primary{background:linear-gradient(#ffdf86,#efac42);border:2px solid #ffefb0;color:#782328;font-weight:600;box-shadow:0 4px #6e1c29,inset 0 -3px #cc852e;font-size:14px;min-height:47px}
#yaloka-christmas-preview .note{color:#f4d5b8;font-size:11px}
#yaloka-christmas-preview .box-scene{border-radius:12px;background:radial-gradient(ellipse at center,#fff4ca44,transparent 65%),linear-gradient(#09243922,#191b4d99),var(--christmas-scene);background-size:cover;background-position:center;padding:31px 0 16px;box-shadow:inset 0 0 0 2px #d5ae6e80}
#yaloka-christmas-preview .big-gift{font-size:103px;filter:drop-shadow(0 6px 12px #050c2580)}
#yaloka-christmas-preview .pool{gap:7px}
#yaloka-christmas-preview .pool-item{background:#7d2230;border-color:#c18d54;color:#fff0cd;font-size:11px;padding:10px 3px}
#yaloka-christmas-preview .pool-item span{display:grid;place-items:center;background:#efdcad;border-radius:50%;width:44px;height:44px;margin:0 auto 7px;font-size:25px;box-shadow:0 2px #60202b}
#yaloka-christmas-preview .pool-item em{color:#ebd3b2;font-size:10px}
#yaloka-christmas-preview .switch{background:#741d29;border:1px solid #c49859;padding:3px}
#yaloka-christmas-preview .switch button{color:#f6d4a7}
#yaloka-christmas-preview .switch button.active{background:#f6d17e;color:#74242b;box-shadow:inset 0 -2px #dba94c}
#yaloka-christmas-preview .winner{background:linear-gradient(#a93539,#721d2c);border:1px solid #ceaa6b;color:#fff0cc;box-shadow:inset 0 2px #f7d59f33}
#yaloka-christmas-preview .winner.first{background:linear-gradient(#f0d087,#c3904d);color:#651e29;border-color:#ffe4a2}
#yaloka-christmas-preview .winner small{color:inherit;font-size:10px}
#yaloka-christmas-preview .avatar{background:#fff1c6;border-color:#e2b665}
#yaloka-christmas-preview .rank-row{border-color:#bd5960;color:#fff0ce}
#yaloka-christmas-preview .gift-choice{background:#fff2d5;border-color:#dbb46b;color:#74252b}
#yaloka-christmas-preview .my{background:#641a29;border-color:#d3aa65;color:#ffecbd}
#yaloka-christmas-preview .modal{background:#fff3d9;border:3px solid #d2ab68;color:#67232b}
#yaloka-christmas-preview .modal-head h3{color:#822a30}
#yaloka-christmas-preview .close{background:#ecd7b0;color:#67232b}
#yaloka-christmas-preview .toast{background:#44262cf5;border:1px solid #dfbc77;color:#fff1d4}
#yaloka-christmas-preview .tier-strip{display:flex;justify-content:space-between;gap:5px;margin:13px 0 4px}
#yaloka-christmas-preview .tier-strip span{flex:1;text-align:center;font-size:10px;border-radius:12px;padding:4px 0;background:#702331;color:#dcbba1;border:1px solid #bc865c}
#yaloka-christmas-preview .tier-strip span.unlocked{background:#f3cc76;color:#76242b;border-color:#ffe4a2}
@media(max-width:350px){#yaloka-christmas-preview .tab{font-size:12px}#yaloka-christmas-preview .hero h1{font-size:33px}#yaloka-christmas-preview .panel{padding-left:9px;padding-right:9px}#yaloka-christmas-preview .reward b{font-size:10px}}

#yaloka-christmas-preview .hero{height:auto;aspect-ratio:1/1.05;min-height:335px;padding:22px 10px;background-image:var(--reference-hero);background-size:cover;background-position:center;isolation:isolate}
#yaloka-christmas-preview .hero:after{content:&#x27;&#x27;;position:absolute;inset:0;background:linear-gradient(#07132b40,transparent 40%,transparent 88%,#841e28);z-index:-1}
#yaloka-christmas-preview .hero h1{font:bold italic clamp(28px,7.8vw,37px)/1.1 Georgia,serif;white-space:nowrap;margin:0 0 7px;letter-spacing:-1px;color:#ffe4a0;text-shadow:0 2px #8e572b,1px 4px 0 #4c241c,0 5px 12px #071a2b}
#yaloka-christmas-preview .hero p{display:none}
#yaloka-christmas-preview .hero .date{position:static;display:block;font-size:13px;font-weight:600;color:#ffe9a6;text-shadow:0 2px #352d21;padding:0;margin:0;letter-spacing:0}
@media(max-width:350px){#yaloka-christmas-preview .hero h1{font-size:28px}#yaloka-christmas-preview .hero{min-height:320px}}

#yaloka-christmas-preview .activity-gifts{margin:0 10px 15px;padding:16px 11px 12px;background:#6e1c2b;border:2px solid #c99f5e;border-radius:14px;color:#fff0ce;position:relative}
#yaloka-christmas-preview .activity-gifts h2{font-size:22px;margin:0 0 12px}
#yaloka-christmas-preview .lucky-gifts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
#yaloka-christmas-preview .event-gift{min-width:0;text-align:center;font-size:11px}
#yaloka-christmas-preview .event-gift .gift-art{display:grid;place-items:center;font-size:34px;height:58px;border-radius:12px;background:radial-gradient(#efd59944,transparent 70%)}
#yaloka-christmas-preview .event-gift b{font-size:11px;font-weight:500;display:block;min-height:31px;line-height:1.3}
#yaloka-christmas-preview .event-gift .price{color:#ffdf8d;font-size:11px;display:block;margin:5px 0}
#yaloka-christmas-preview .gift-type{font-size:10px;color:#f6dbc1}
#yaloka-christmas-preview .regular-gift{display:flex;gap:9px;align-items:center;background:#8a2b34;border-radius:9px;padding:8px 10px;margin-top:11px;font-size:11px}
#yaloka-christmas-preview .regular-gift .gift-art{font-size:27px}
#yaloka-christmas-preview .regular-gift b{display:block;font-weight:500}
#yaloka-christmas-preview .regular-gift strong{margin-left:auto;font-size:13px;color:#ffe39e;white-space:nowrap}
#yaloka-christmas-preview .gift-rules{padding:10px 0 0;margin-top:9px;border-top:1px solid #a45951;font-size:11px;line-height:1.7;color:#f5dfc5}
#yaloka-christmas-preview .gift-rules p{margin:2px 0}
#yaloka-christmas-preview .gift-rules strong{color:#ffe1a0;font-weight:600}
#yaloka-christmas-preview .rewards{display:flex;flex-direction:column;gap:10px}
#yaloka-christmas-preview .reward{display:grid;grid-template-columns:90px minmax(0,1fr);text-align:left;padding:0;overflow:hidden;position:relative;min-height:100px}
#yaloka-christmas-preview .tier-condition{background:#5d1927;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 4px;gap:6px}
#yaloka-christmas-preview .tier-condition .tier-name{font-family:Georgia,serif;font-size:15px;color:#ffe3a2}
#yaloka-christmas-preview .tier-condition .threshold{font-size:14px;color:#ffdf91;font-weight:600}
#yaloka-christmas-preview .tier-condition .point-unit{font-size:10px;color:#e6c5ad}
#yaloka-christmas-preview .reward.done .tier-condition{background:#204c3b}
#yaloka-christmas-preview .tier-content{padding:12px 8px 8px;min-width:0}
#yaloka-christmas-preview .tier-items{display:flex;justify-content:space-evenly;gap:5px;align-items:flex-start}
#yaloka-christmas-preview .tier-prize{flex:1;min-width:0;text-align:center;font-size:11px;line-height:1.25}
#yaloka-christmas-preview .tier-prize .ico{width:39px;height:39px;line-height:34px;font-size:22px;margin:0 auto 7px;border-radius:9px}
#yaloka-christmas-preview .tier-prize b{font-size:11px;min-height:28px;overflow-wrap:anywhere;font-weight:400}
#yaloka-christmas-preview .tier-state{font-size:10px;text-align:right;color:#f5d69a;padding-top:8px}
#yaloka-christmas-preview .reward.done .tier-state{color:#cceccf}
#yaloka-christmas-preview .box-scene{height:410px;padding:0;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 49%,#ffe5a136,transparent 57%),linear-gradient(#142f43b3,#48253d77),var(--christmas-scene);background-size:cover;background-position:center}
#yaloka-christmas-preview .big-gift{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:87px;line-height:1;z-index:2;filter:drop-shadow(0 9px 15px #fff0b433);pointer-events:none}
#yaloka-christmas-preview .box-scene:after{content:&#x27;&#x27;;position:absolute;left:50%;top:50%;width:120px;height:120px;border-radius:50%;transform:translate(-50%,-50%);background:#ffe38f22;box-shadow:0 0 35px #ffe38f44;pointer-events:none}
#yaloka-christmas-preview .pool{position:absolute;inset:0;display:block;margin:0;z-index:3}
#yaloka-christmas-preview .pool-item{position:absolute;width:72px;min-height:77px;transform:translate(-50%,-50%);border:0;background:transparent;padding:0;line-height:1.25;color:#fff2d4;cursor:pointer}
#yaloka-christmas-preview .pool-item span{width:48px;height:48px;border:1px solid #f4d592;border-radius:50%;background:radial-gradient(circle at 30% 20%,#fff4d9ee,#dcb97a88 45%,#bfe0dd44 72%);box-shadow:inset 0 0 9px #fff9,0 4px 14px #051b3f66;margin:0 auto 5px;font-size:25px;line-height:45px;text-align:center}
#yaloka-christmas-preview .pool-item em{font-size:10px;color:#ffe0a3;margin-top:2px}
#yaloka-christmas-preview .box-balance{text-align:center;padding:13px 0 0}
#yaloka-christmas-preview .box-balance .number{font-size:30px}
#yaloka-christmas-preview .empty-note{text-align:center;font-size:11px;color:#f1d6be;margin:10px 0}
@media(max-width:350px){#yaloka-christmas-preview .pool-item{width:62px;font-size:10px}#yaloka-christmas-preview .pool-item span{width:43px;height:43px;font-size:23px}#yaloka-christmas-preview .box-scene{height:390px}#yaloka-christmas-preview .reward{grid-template-columns:78px minmax(0,1fr)}#yaloka-christmas-preview .tier-content{padding-left:5px;padding-right:5px}#yaloka-christmas-preview .event-gift b{font-size:10px}}



#yaloka-christmas-preview .activity-gifts{padding:12px 10px 9px;margin-bottom:12px}
#yaloka-christmas-preview .activity-gifts h2{font-size:20px;margin-bottom:4px}
#yaloka-christmas-preview .lucky-gifts{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
#yaloka-christmas-preview .event-gift .gift-art{height:49px;font-size:30px}
#yaloka-christmas-preview .event-gift .price{font-size:11px;margin:2px 0 0}
#yaloka-christmas-preview .pending-gift{opacity:.6}

#yaloka-christmas-preview .tier-nav-label{text-align:center;color:#ffe6ad;font-family:Georgia,serif;font-size:18px}
#yaloka-christmas-preview .tier-nav-label small{display:block;font-family:system-ui,sans-serif;font-size:11px;color:#e8cab0;margin-top:3px}

#yaloka-christmas-preview .tier-module .number{font-size:28px}
#yaloka-christmas-preview .tier-module .rewards{padding:0 11px 12px}

#yaloka-christmas-preview .tier-module .reward.done{background:transparent}
#yaloka-christmas-preview .tier-module .tier-content{padding:0}
