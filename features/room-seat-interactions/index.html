&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(

  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();

  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)

    }

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)

      privateContent: null,

  const fileElement = document.getElementById(&quot;codex-preview-files&quot;);

    if (fileElement != null) {

      fileElement.remove();

      const urls = [];

    connectorGlobals.visualization = {
      get bindings() {
        return bindings;
      },
      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {
        if (typeof callback !== &quot;function&quot;) {
          throw new TypeError(&quot;onData requires a callback&quot;);

        return () =&gt; {};

  }
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;

      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));

        return;
      }

        target == null ||

      });

    }

  });

  const root = document.getElementById(&#x27;yaloka-stage-review&#x27;);

  const legendEnabled = legendPreview.querySelector(&#x27;input&#x27;);

  const people = {
    im: { name:&#x27;IM manager&#x27;, port:&#x27;owner&#x27;, id:&#x27;9111&#x27; },
    lucky: { name:&#x27;luckymay&#x27;, port:&#x27;lucky&#x27;, id:&#x27;8853&#x27; },
    guest: { name:&#x27;Guest&#x27;, port:null }
  };
  const exampleAdmins = Array.from({ length:5 }, (_, index) =&gt; `demo-${index + 1}`);
  const roomAdmins = new Map();
  const seniorAdminLimit = 5;
  const seniorAdminCount = () =&gt; [...roomAdmins.values()].filter(role =&gt; role === &#x27;senior&#x27;).length;
  const gifts = [
    [&#x27;Boba Tea 4U&#x27;,16000],[&#x27;Flower 4U&#x27;,17000],[&#x27;Heart Diamond&#x27;,700],[&#x27;Lipstick&#x27;,500],
    [&#x27;Latte&#x27;,500],[&#x27;Perfume&#x27;,1000],[&#x27;Lucky Charm&#x27;,2000],[&#x27;Sundae&#x27;,100]
  ];
  const seats = Array.from({ length:10 }, () =&gt; ({ user:null, locked:false }));
  seats[0].user = &#x27;im&#x27;;
  seats[6].user = &#x27;lucky&#x27;;
  seats[7].locked = true;
  const invites = new Map();
  const dialogs = [];
  let role = &#x27;owner&#x27;;
  let balance = 139054;
  let giftIndex = null;
  let toastTimer;
  let returnFocus;

  const myUser = () =&gt; role === &#x27;visitor&#x27; ? &#x27;guest&#x27; : &#x27;im&#x27;;
  const isManager = () =&gt; role !== &#x27;visitor&#x27;;
  const isOwner = () =&gt; role === &#x27;owner&#x27;;
  const onStage = user =&gt; seats.findIndex(seat =&gt; seat.user === user);
  const pending = () =&gt; invites.get(myUser());
  const current = () =&gt; dialogs[dialogs.length - 1];
  const action = (label, key, extra = &#x27;&#x27;) =&gt; `&lt;button type=&quot;button&quot; data-action=&quot;${key}&quot; ${extra}&gt;${label}&lt;/button&gt;`;
  const pill = (label, key, primary = false) =&gt; action(label,key,`class=&quot;pill${primary ? &#x27; primary&#x27; : &#x27;&#x27;}&quot;`);
  const img = (asset, cls = &#x27;&#x27;, alt = &#x27;&#x27;) =&gt; `&lt;img class=&quot;${cls}&quot; src=&quot;${images[asset]}&quot; alt=&quot;${alt}&quot;&gt;`;
  const avatar = user =&gt; `&lt;span class=&quot;avatar&quot; aria-hidden=&quot;true&quot;&gt;${people[user].port ? img(people[user].port) : &#x27;G&#x27;}&lt;/span&gt;`;

  room.style.backgroundImage = `url(&quot;${images.room}&quot;)`;
  root.querySelector(&#x27;.chat-user&#x27;).innerHTML = `${avatar(&#x27;lucky&#x27;)}&lt;span&gt;luckymay &lt;span class=&quot;joined&quot;&gt;Joined&lt;/span&gt;&lt;/span&gt;`;

  function renderRoom() {
    legendPreview.hidden = role !== &#x27;visitor&#x27;;
    fillAdminDemo.hidden = !isOwner();
    seatsView.innerHTML = seats.map((seat, index) =&gt; {
      const label = seat.user ? people[seat.user].name : seat.locked ? &#x27;Locked seat&#x27; : &#x27;Empty seat&#x27;;
      const x = [8.4,29.2,50,70.8,91.6][index % 5];
      const y = index &lt; 5 ? 17.76 : 27.39;
      const content = seat.user
        ? `${avatar(seat.user)}&lt;span class=&quot;seat-name&quot;&gt;${people[seat.user].name}&lt;/span&gt;`
        : seat.locked ? `&lt;span class=&quot;locked-icon&quot; aria-hidden=&quot;true&quot;&gt;${img(&#x27;lockedSeatIcon&#x27;)}&lt;/span&gt;`
        : img(&#x27;emptySeatIcon&#x27;,&#x27;empty-seat-icon&#x27;);
      return `&lt;button type=&quot;button&quot; class=&quot;seat&quot; data-seat=&quot;${index}&quot; style=&quot;--x:${x}%;--y:${y}%&quot; aria-label=&quot;Seat ${index+1}: ${label}&quot;&gt;${content}&lt;/button&gt;`;
    }).join(&#x27;&#x27;);
    for (const button of roles) {
      const active = button.dataset.role === role;
      const waiting = button.dataset.role === &#x27;visitor&#x27; &amp;&amp; invites.has(&#x27;guest&#x27;) &amp;&amp; !active;
      button.setAttribute(&#x27;aria-pressed&#x27;,active);
      button.classList.toggle(&#x27;has-invite&#x27;,waiting);
      button.setAttribute(&#x27;aria-label&#x27;, waiting ? &#x27;普通用户，有上麦邀请&#x27; : button.textContent);
    }
  }

  function dismissToast() {
    clearTimeout(toastTimer);
    toast.hidden = true;
  }

  function say(message) {
    dismissToast();
    toast.textContent = message;
    toast.hidden = false;
    toastTimer = setTimeout(() =&gt; { toast.hidden = true; }, 2500);
  }

  function show(type, params = {}, keepPrevious = false) {
    dismissToast();
    if (!dialogs.length) returnFocus = document.activeElement;
    if (!keepPrevious &amp;&amp; dialogs.length) dialogs.pop();
    dialogs.push({ type, ...params });
    renderDialog();
  }

  function close(all = false, restore = true) {
    const returningFromAdminHelp = !all &amp;&amp; current()?.type === &#x27;room-admin-help&#x27;;
    if (all) dialogs.length = 0;
    else dialogs.pop();
    renderDialog();
    if (restore &amp;&amp; returningFromAdminHelp) {
      layer.querySelector(&#x27;[data-action=&quot;open-admin-help&quot;]&#x27;)?.focus({preventScroll:true});
    }
    if (restore &amp;&amp; !dialogs.length) {
      const seat = returnFocus?.dataset.seat;
      const target = returnFocus?.isConnected ? returnFocus : seatsView.querySelector(`[data-seat=&quot;${seat}&quot;]`);
      target?.focus({ preventScroll:true });
    }
  }

  function menu(items) {
    const rows = items.map(([label,key,icon]) =&gt; {
      return action(`&lt;span class=&quot;menu-icon&quot; aria-hidden=&quot;true&quot;&gt;${img(icon)}&lt;/span&gt;&lt;span class=&quot;menu-label&quot;&gt;${label}&lt;/span&gt;`,key);
    }).join(&#x27;&#x27;);
    return `&lt;div class=&quot;panel menu safe&quot;&gt;&lt;div class=&quot;menu-options&quot;&gt;${rows}&lt;/div&gt;${action(&#x27;Cancel&#x27;,&#x27;close&#x27;)}&lt;/div&gt;`;
  }

  function listRow(user, inviteMode) {
    const person = people[user];
    const content = user === &#x27;im&#x27; &amp;&amp; user === myUser()
      ? img(&#x27;ownerList&#x27;,&#x27;owner-list-art&#x27;)
      : `${avatar(user)}&lt;span class=&quot;person-text&quot;&gt;${person.name}${user === myUser() ? &#x27; &lt;small&gt;(Me)&lt;/small&gt;&#x27; : &#x27;&#x27;}${user === &#x27;lucky&#x27; ? img(&#x27;luckyBadges&#x27;,&#x27;badge-art&#x27;) : &#x27;&#x27;}&lt;/span&gt;`;
    const invite = inviteMode
      ? invites.has(user)
        ? &#x27;&lt;button type=&quot;button&quot; class=&quot;pill&quot; disabled&gt;Invited&lt;/button&gt;&#x27;
        : pill(&#x27;Invite&#x27;, `invite-${user}`, true)
      : &#x27;&#x27;;
    return `&lt;div class=&quot;person-row&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;person-tap&quot; data-action=&quot;profile-${user}&quot; aria-label=&quot;${person.name} Profile&quot;&gt;${content}&lt;/button&gt;${invite}&lt;/div&gt;`;
  }

  function profile(user) {
    const self = user === myUser();
    const canManage = isManager() &amp;&amp; !self;
    const leaveAction = self &amp;&amp; onStage(user) !== -1
      ? action(img(&#x27;leaveSeatIcon&#x27;),&#x27;leave&#x27;,&#x27;class=&quot;profile-leave&quot; aria-label=&quot;Leave Seat&quot;&#x27;)
      : &#x27;&#x27;;
    const giftAction = action(&#x27;&#x27;, &#x27;profile-gift&#x27;, &#x27;class=&quot;tap profile-gift&quot; aria-label=&quot;Send Gift&quot;&#x27;);
    const settings = !self
      ? action(&#x27;&#x27;, &#x27;settings&#x27;, &#x27;class=&quot;tap profile-settings&quot; aria-label=&quot;资料卡设置&quot;&#x27;)
      : &#x27;&#x27;;
    if (user === &#x27;im&#x27; &amp;&amp; self) {
      return `&lt;div class=&quot;panel profile&quot;&gt;&lt;div class=&quot;self-profile-hero&quot;&gt;${img(&#x27;ownerInfo&#x27;,&#x27;profile-art&#x27;)}${leaveAction}&lt;/div&gt;&lt;div class=&quot;profile-foot safe&quot;&gt;${action(img(&#x27;selfGift&#x27;),&#x27;profile-gift&#x27;,&#x27;class=&quot;self-gift&quot; aria-label=&quot;Send Gift&quot;&#x27;)}&lt;/div&gt;&lt;/div&gt;`;
    }
    if (user === &#x27;lucky&#x27; || user === &#x27;im&#x27;) {
      const profileArt = user === &#x27;lucky&#x27; ? &#x27;luckyInfo&#x27; : &#x27;ownerInfo&#x27;;
      const managementBar = canManage ? img(&#x27;profileManagement&#x27;,&#x27;actions-art profile-management&#x27;) : &#x27;&#x27;;
      return `&lt;div class=&quot;panel profile&quot;&gt;${img(profileArt,&#x27;profile-art&#x27;)}&lt;div class=&quot;profile-foot safe&quot;&gt;&lt;div class=&quot;profile-actions&quot;&gt;${img(&#x27;profileActions&#x27;,&#x27;actions-art&#x27;)}${settings}${giftAction}&lt;/div&gt;${managementBar}&lt;/div&gt;&lt;/div&gt;`;
    }
    const simpleSettings = !self ? pill(&#x27;Settings&#x27;,&#x27;settings&#x27;) : &#x27;&#x27;;
    return `&lt;div class=&quot;panel profile&quot;&gt;&lt;div class=&quot;simple-profile&quot;&gt;${leaveAction}${avatar(user)}&lt;h2&gt;${people[user].name}&lt;/h2&gt;${people[user].id ? `&lt;p&gt;ID:${people[user].id}&lt;/p&gt;` : &#x27;&#x27;}&lt;div class=&quot;simple-actions&quot;&gt;${simpleSettings}${pill(&#x27;Send Gift&#x27;,&#x27;profile-gift&#x27;)}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;profile-foot safe&quot;&gt;&lt;/div&gt;&lt;/div&gt;`;
  }

  function giftPanel(user) {
    const giftButtons = gifts.map(([name, price], index) =&gt;
      action(`${img(&#x27;gift&#x27;+index)}&lt;span&gt;${name}&lt;/span&gt;&lt;small&gt;${price}&lt;/small&gt;`, `gift-item-${index}`, `class=&quot;gift-item&quot; aria-pressed=&quot;${giftIndex === index}&quot;`)
    ).join(&#x27;&#x27;);
    return `&lt;div class=&quot;panel gift-panel safe&quot;&gt;
      &lt;div class=&quot;recipient&quot;&gt;&lt;span class=&quot;recipient-label&quot;&gt;Sent to&lt;/span&gt;&lt;span&gt;${people[user].name}&lt;/span&gt;${avatar(user)}${pill(`${img(&#x27;profileIcon&#x27;)}&lt;span&gt;Profile&lt;/span&gt;`,&#x27;gift-profile&#x27;)}&lt;/div&gt;
      ${img(&#x27;level&#x27;,&#x27;level-art&#x27;)}
      &lt;div class=&quot;gift-tabs&quot; aria-label=&quot;礼物分类&quot;&gt;&lt;strong&gt;Popular&lt;/strong&gt;&lt;span&gt;Lucky&lt;/span&gt;&lt;span&gt;LuckyPro&lt;/span&gt;&lt;span&gt;CP&lt;/span&gt;&lt;span&gt;Exclusive&lt;/span&gt;&lt;span&gt;Backpack&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;gift-grid scrollable&quot; aria-label=&quot;选择礼物&quot;&gt;${giftButtons}&lt;/div&gt;
      &lt;div class=&quot;gift-footer&quot;&gt;&lt;div class=&quot;balance&quot;&gt;${img(&#x27;coin&#x27;)}&lt;span&gt;${balance}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;send-group&quot;&gt;&lt;span&gt;1&lt;/span&gt;${pill(&#x27;Send&#x27;,&#x27;send-gift&#x27;,true)}&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;`;
  }

  function roomSettings(behind = false) {
    const labels = [&#x27;Room Avatar&#x27;,&#x27;Room Name&#x27;,&#x27;Announcement&#x27;,&#x27;Room Background&#x27;,&#x27;Room Decoration&#x27;];
    const values = [img(&#x27;roomIcon&#x27;),&#x27;User9111&#x27;,&#x27;&lt;small&gt;No room announcement set&lt;/small&gt;&#x27;,&#x27;&#x27;,&#x27;&#x27;];
    const chevron = &#x27;&lt;span class=&quot;room-chevron&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&#x27;;
    const rows = labels.map((label,index) =&gt; `&lt;div class=&quot;room-settings-row&quot;&gt;&lt;span&gt;${label}&lt;/span&gt;&lt;span class=&quot;room-settings-value&quot;&gt;${values[index]}${chevron}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
    const back = action(&#x27;‹&#x27;,&#x27;close&#x27;,&#x27;class=&quot;room-panel-back&quot; aria-label=&quot;Back&quot;&#x27;);
    const admin = action(`&lt;span&gt;Admin&lt;/span&gt;${chevron}`,&#x27;open-room-admin&#x27;,&#x27;class=&quot;room-settings-row&quot;&#x27;);
    const blockList = `&lt;div class=&quot;room-settings-row&quot;&gt;&lt;span&gt;Block List&lt;/span&gt;${chevron}&lt;/div&gt;`;
    return `&lt;div class=&quot;room-settings safe&quot; ${behind ? &#x27;inert aria-hidden=&quot;true&quot;&#x27; : &#x27;&#x27;}&gt;&lt;div class=&quot;room-panel-heading&quot;&gt;${back}Room Settings&lt;/div&gt;&lt;div class=&quot;scrollable&quot;&gt;${rows}${admin}${blockList}&lt;/div&gt;&lt;/div&gt;`;
  }

  function roomAdminRow(id, list) {
    const person = people[id];
    const name = person?.name ?? `User ${id.split(&#x27;-&#x27;).at(-1)}`;
    const portrait = id === &#x27;im&#x27; ? `&lt;span class=&quot;avatar&quot;&gt;${img(&#x27;roomIcon&#x27;)}&lt;/span&gt;` : person ? avatar(id) : &#x27;&lt;span class=&quot;avatar&quot; aria-hidden=&quot;true&quot;&gt;A&lt;/span&gt;&#x27;;
    const assignedRole = roomAdmins.get(id);
    const senior = assignedRole === &#x27;senior&#x27;;
    const badge = senior ? img(&#x27;seniorAdminBadge&#x27;,&#x27;room-admin-badge senior-admin-badge&#x27;,&#x27;Senior Admin&#x27;) : img(&#x27;roomAdminBadge&#x27;,&#x27;room-admin-badge&#x27;,&#x27;Room Admin&#x27;);
    const roleLabel = list === &#x27;assigned&#x27; ? `&lt;span class=&quot;room-admin-role&quot;&gt;${badge}&lt;/span&gt;` : &#x27;&#x27;;
    let trailing = &#x27;&#x27;;
    if (list === &#x27;online&#x27; &amp;&amp; id !== &#x27;im&#x27;) {
      const seniorButton = roomAdminAction(&#x27;Senior Admin&#x27;,id,&#x27;senior&#x27;,&#x27;room-role-option&#x27;,`aria-pressed=&quot;${senior}&quot;`);
      const adminButton = roomAdminAction(&#x27;Admin&#x27;,id,&#x27;admin&#x27;,&#x27;room-role-option&#x27;,`aria-pressed=&quot;${assignedRole === &#x27;admin&#x27;}&quot;`);
      trailing = `&lt;div class=&quot;room-role-split&quot; role=&quot;group&quot; aria-label=&quot;Admin role for ${name}&quot;&gt;${seniorButton}${adminButton}&lt;/div&gt;`;
    }
    if (list === &#x27;assigned&#x27;) trailing = roomAdminAction(&#x27;Remove&#x27;,id,&#x27;visitor&#x27;);
    if (list === &#x27;info&#x27;) trailing = badge;
    return `&lt;div class=&quot;room-admin-row&quot;&gt;${portrait}&lt;span class=&quot;room-admin-name&quot;&gt;${name}${id === &#x27;im&#x27; ? &#x27; (Me)&#x27; : &#x27;&#x27;}${roleLabel}&lt;/span&gt;${trailing}&lt;/div&gt;`;
  }

  function roomAdminAction(label, id, assignedRole, classes = &#x27;pill&#x27;, pressed = &#x27;&#x27;) {
    return action(label,&#x27;change-room-admin&#x27;,`class=&quot;${classes}&quot; data-user=&quot;${id}&quot; data-admin-role=&quot;${assignedRole}&quot; ${pressed}`);
  }

  function roomAdminPanel(tab) {
    const online = tab === &#x27;online&#x27;;
    const ids = online ? [...Object.keys(people).filter(id =&gt; id !== &#x27;im&#x27;),&#x27;im&#x27;] : [...roomAdmins.keys()];
    const rows = ids.map(id =&gt; roomAdminRow(id,online ? &#x27;online&#x27; : &#x27;assigned&#x27;)).join(&#x27;&#x27;) || &#x27;&lt;div class=&quot;list-empty&quot;&gt;No room admins yet.&lt;/div&gt;&#x27;;
    const back = action(&#x27;‹&#x27;,&#x27;close&#x27;,&#x27;class=&quot;room-panel-back&quot; aria-label=&quot;Back&quot;&#x27;);
    const help = action(&#x27;&lt;span aria-hidden=&quot;true&quot;&gt;?&lt;/span&gt;&#x27;,&#x27;open-admin-help&#x27;,&#x27;class=&quot;room-panel-help&quot; aria-label=&quot;Admin Permissions&quot;&#x27;);
    const tabs = action(&#x27;Admin&#x27;,&#x27;room-admin-list&#x27;,`aria-pressed=&quot;${!online}&quot;`) + action(&#x27;Online&#x27;,&#x27;room-admin-online&#x27;,`aria-pressed=&quot;${online}&quot;`);
    return `${roomSettings(true)}&lt;div class=&quot;room-settings-shade&quot;&gt;&lt;/div&gt;&lt;div class=&quot;panel room-admin-panel safe&quot;&gt;&lt;div class=&quot;room-panel-heading&quot;&gt;${back}Admin${help}&lt;/div&gt;&lt;div class=&quot;room-admin-tabs&quot; aria-label=&quot;Admin&quot;&gt;${tabs}&lt;/div&gt;&lt;div class=&quot;scrollable${online ? &#x27; room-admin-online&#x27; : &#x27;&#x27;}&quot;&gt;${rows}&lt;/div&gt;&lt;/div&gt;`;
  }

  function roomInfoPanel(tab) {
    const showAdmins = tab === &#x27;admin&#x27;;
    const tabs = action(&#x27;Room Info&#x27;,&#x27;room-info-details&#x27;,`aria-pressed=&quot;${!showAdmins}&quot;`) + action(&#x27;Admin&#x27;,&#x27;room-info-admin&#x27;,`aria-pressed=&quot;${showAdmins}&quot;`);
    const rows = showAdmins
      ? [...roomAdmins.keys()].map(id =&gt; roomAdminRow(id,&#x27;info&#x27;)).join(&#x27;&#x27;) || &#x27;&lt;div class=&quot;list-empty&quot;&gt;No room admins yet.&lt;/div&gt;&#x27;
      : `&lt;div class=&quot;room-info-card room-level-card&quot;&gt;
          &lt;span class=&quot;room-level-emblem&quot; aria-hidden=&quot;true&quot;&gt;I&lt;/span&gt;
          &lt;div class=&quot;room-level-details&quot;&gt;&lt;span&gt;Room Level &lt;strong&gt;LV.0&lt;/strong&gt;&lt;/span&gt;&lt;div class=&quot;room-level-progress&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;small&gt;27,870 EXP left to the next level&lt;/small&gt;&lt;/div&gt;
          &lt;span class=&quot;room-chevron&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;room-info-card room-owner-card&quot;&gt;${avatar(&#x27;im&#x27;)}&lt;span&gt;${people.im.name} &lt;strong class=&quot;room-owner-label&quot;&gt;Owner&lt;/strong&gt;&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;room-info-card room-announcement&quot;&gt;Announcement&lt;small&gt;No room announcement set&lt;/small&gt;&lt;/div&gt;`;
    const settings = isOwner() &amp;&amp; !showAdmins ? action(&#x27;Settings&#x27;,&#x27;open-room-settings&#x27;,&#x27;class=&quot;pill primary room-info-settings&quot;&#x27;) : &#x27;&#x27;;
    return `&lt;div class=&quot;panel room-info-panel safe&quot;&gt;&lt;div class=&quot;room-info-header&quot;&gt;${img(&#x27;roomIcon&#x27;)}&lt;div&gt;User9111&lt;small&gt;🇧🇩 ID:9111&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;room-info-tabs&quot; aria-label=&quot;Room information&quot;&gt;${tabs}&lt;/div&gt;&lt;div class=&quot;scrollable&quot;&gt;${rows}&lt;/div&gt;${settings}&lt;/div&gt;`;
  }

  function changeRoomAdmin(id, assignedRole) {
    if (!isOwner() || id === &#x27;im&#x27; || (roomAdmins.get(id) ?? &#x27;visitor&#x27;) === assignedRole) return false;
    if (assignedRole === &#x27;senior&#x27; &amp;&amp; seniorAdminCount() &gt;= seniorAdminLimit) {
      say(&#x27;This room can have up to 5 senior admins.&#x27;);
      return false;
    }
    if (assignedRole === &#x27;visitor&#x27;) {
      roomAdmins.delete(id);
    } else {
      roomAdmins.set(id,assignedRole);
    }
    dismissToast();
    return true;
  }

  function renderDialog(focus = true) {
    const dialog = current();
    overlay.hidden = !dialog;
    room.inert = Boolean(dialog);
    if (!dialog) {
      layer.replaceChildren();
      return;
    }
    const { type, index, user } = dialog;
    layer.classList.toggle(&#x27;center&#x27;, type === &#x27;settings&#x27; || type === &#x27;received&#x27;);
    let title;
    let body;
    switch (type) {
      case &#x27;seat&#x27;: {
        const seat = seats[index];
        const vacant = seats.filter(item =&gt; !item.user);
        const allLocked = vacant.every(item =&gt; item.locked);
        title = `Seat ${index + 1} options`;
        body = seat.locked
          ? menu([[&#x27;Unlock Seat&#x27;,&#x27;toggle-lock&#x27;,&#x27;unlockIcon&#x27;], ...(allLocked ? [[&#x27;Unlock All Seats&#x27;,&#x27;toggle-all&#x27;,&#x27;unlockIcon&#x27;]] : [])])
          : menu([[&#x27;Take a Seat&#x27;,&#x27;join&#x27;,&#x27;joinSeatIcon&#x27;],[&#x27;Lock Seat&#x27;,&#x27;toggle-lock&#x27;,&#x27;lockIcon&#x27;],[&#x27;Lock All Seats&#x27;,&#x27;toggle-all&#x27;,&#x27;lockIcon&#x27;],[&#x27;Invite to a Seat&#x27;,&#x27;invite-list&#x27;,&#x27;inviteIcon&#x27;]]);
        break;
      }
      case &#x27;self&#x27;:
        title = &#x27;My seat options&#x27;;
        body = menu([[&#x27;Leave Seat&#x27;,&#x27;leave&#x27;,&#x27;leaveSeatIcon&#x27;],[&#x27;Send Gift&#x27;,&#x27;self-send&#x27;,&#x27;giftIcon&#x27;],[&#x27;Profile&#x27;,&#x27;self-profile&#x27;,&#x27;profileIcon&#x27;]]);
        break;
      case &#x27;list&#x27;: {
        const inviteMode = index !== undefined;
        const ids = Object.keys(people);
        const speakers = ids.filter(id =&gt; onStage(id) &gt;= 0);
        const listeners = ids.filter(id =&gt; onStage(id) &lt; 0);
        title = inviteMode ? &#x27;Invite to a Seat&#x27; : &#x27;Online users&#x27;;
        const rows = inviteMode
          ? listeners.filter(id =&gt; id !== myUser()).map(id =&gt; listRow(id,true)).join(&#x27;&#x27;) || &#x27;&lt;div class=&quot;list-empty&quot;&gt;No listeners to invite.&lt;/div&gt;&#x27;
          : `&lt;h3 class=&quot;list-group&quot;&gt;Speakers&lt;/h3&gt;
            ${speakers.length ? speakers.map(id =&gt; listRow(id,false)).join(&#x27;&#x27;) : &#x27;&lt;div class=&quot;list-empty&quot;&gt;It’s way too quiet here. Take a seat and say hello!&lt;/div&gt;&#x27;}
            &lt;h3 class=&quot;list-group&quot;&gt;Listeners&lt;/h3&gt;
            ${listeners.length ? listeners.map(id =&gt; listRow(id,false)).join(&#x27;&#x27;) : &#x27;&lt;div class=&quot;list-empty&quot;&gt;No listeners yet.&lt;/div&gt;&#x27;}`;
        body = `&lt;div class=&quot;panel list-panel safe&quot;&gt;${inviteMode ? `&lt;h2 class=&quot;list-title&quot;&gt;${title}&lt;/h2&gt;` : &#x27;&#x27;}&lt;div class=&quot;scrollable&quot;&gt;${rows}&lt;/div&gt;&lt;/div&gt;`;

        body = `&lt;section class=&quot;room-settings safe&quot;&gt;
          &lt;div class=&quot;room-panel-heading&quot;&gt;${action(&#x27;‹&#x27;,&#x27;close&#x27;,&#x27;class=&quot;room-panel-back&quot; aria-label=&quot;Back&quot;&#x27;)}${title}&lt;/div&gt;

            &lt;table class=&quot;permissions-table&quot; aria-label=&quot;Room admin permissions&quot;&gt;
              &lt;colgroup&gt;&lt;col&gt;&lt;col&gt;&lt;col&gt;&lt;/colgroup&gt;
              &lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Permission&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Room Admin&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Senior Admin&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
              &lt;tbody&gt;
                &lt;tr class=&quot;permission-category&quot;&gt;&lt;th scope=&quot;rowgroup&quot; colspan=&quot;3&quot;&gt;Admin management&lt;/th&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Set / remove Room Admin&lt;/th&gt;&lt;td&gt;&lt;span class=&quot;permission-mark&quot; role=&quot;img&quot; aria-label=&quot;Not allowed&quot;&gt;❌&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;permission-mark&quot; role=&quot;img&quot; aria-label=&quot;Allowed&quot;&gt;✅&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;/tbody&gt;
              &lt;tbody&gt;
                &lt;tr class=&quot;permission-category&quot;&gt;&lt;th scope=&quot;rowgroup&quot; colspan=&quot;3&quot;&gt;Seat management&lt;small&gt;Seat locks apply to empty seats.&lt;/small&gt;&lt;/th&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Lock / unlock seat&lt;/th&gt;&lt;td&gt;&lt;span class=&quot;permission-mark&quot; role=&quot;img&quot; aria-label=&quot;Allowed&quot;&gt;✅&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;permission-mark&quot; role=&quot;img&quot; aria-label=&quot;Allowed&quot;&gt;✅&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Lock / unlock all seats&lt;/th&gt;&lt;td&gt;&lt;span class=&quot;permission-mark&quot; role=&quot;img&quot; aria-label=&quot;Allowed&quot;&gt;✅&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;permission-mark&quot; role=&quot;img&quot; aria-label=&quot;Allowed&quot;&gt;✅&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Invite to a seat&lt;/th&gt;&lt;td&gt;&lt;span class=&quot;permission-mark&quot; role=&quot;img&quot; aria-label=&quot;Allowed&quot;&gt;✅&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;permission-mark&quot; role=&quot;img&quot; aria-label=&quot;Allowed&quot;&gt;✅&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Remove from seat&lt;/th&gt;&lt;td&gt;&lt;span class=&quot;permission-mark&quot; role=&quot;img&quot; aria-label=&quot;Allowed&quot;&gt;✅&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;permission-mark&quot; role=&quot;img&quot; aria-label=&quot;Allowed&quot;&gt;✅&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;/tbody&gt;
              &lt;tbody&gt;
                &lt;tr class=&quot;permission-category&quot;&gt;&lt;th scope=&quot;rowgroup&quot; colspan=&quot;3&quot;&gt;Member moderation&lt;small&gt;Actions on members apply only to members with a lower room role.&lt;/small&gt;&lt;/th&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Kick out the room&lt;/th&gt;&lt;td&gt;&lt;span class=&quot;permission-mark&quot; role=&quot;img&quot; aria-label=&quot;Allowed&quot;&gt;✅&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;permission-mark&quot; role=&quot;img&quot; aria-label=&quot;Allowed&quot;&gt;✅&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Ban / unban messages&lt;/th&gt;&lt;td&gt;&lt;span class=&quot;permission-mark&quot; role=&quot;img&quot; aria-label=&quot;Allowed&quot;&gt;✅&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;permission-mark&quot; role=&quot;img&quot; aria-label=&quot;Allowed&quot;&gt;✅&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Mute / unmute mic&lt;/th&gt;&lt;td&gt;&lt;span class=&quot;permission-mark&quot; role=&quot;img&quot; aria-label=&quot;Allowed&quot;&gt;✅&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;permission-mark&quot; role=&quot;img&quot; aria-label=&quot;Allowed&quot;&gt;✅&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;View block list&lt;/th&gt;&lt;td&gt;&lt;span class=&quot;permission-mark&quot; role=&quot;img&quot; aria-label=&quot;Allowed&quot;&gt;✅&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;permission-mark&quot; role=&quot;img&quot; aria-label=&quot;Allowed&quot;&gt;✅&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;Block / unblock entry&lt;/th&gt;&lt;td&gt;&lt;span class=&quot;permission-mark&quot; role=&quot;img&quot; aria-label=&quot;Allowed&quot;&gt;✅&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;permission-mark&quot; role=&quot;img&quot; aria-label=&quot;Allowed&quot;&gt;✅&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;/tbody&gt;

        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
