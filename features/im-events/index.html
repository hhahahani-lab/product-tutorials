  #yaloka-im-demo *, #yaloka-im-demo *::before, #yaloka-im-demo *::after { box-sizing: border-box; }
  #yaloka-im-demo [hidden] { display: none !important; }
  #yaloka-im-demo button, #yaloka-im-demo input { font: inherit; }
  #yaloka-im-demo button {
    border: 0;
    padding: 0;
    background: none;
    color: inherit;
    text-align: inherit;
  }
  #yaloka-im-demo button:focus-visible, #yaloka-im-demo input:focus-visible {
    outline: 2px solid #c495ff;
    outline-offset: 3px;
  }
  #yaloka-im-demo .im-preview { display: grid; justify-items: center; padding: 14px 0 10px; }
  #yaloka-im-demo .im-stage { width: min(100%, 390px); container-type: inline-size; }
  #yaloka-im-demo .im-phone {
    color-scheme: dark;
    position: relative;
    isolation: isolate;
    display: grid;
    grid-template-rows: 37px minmax(0, 1fr);
    height: clamp(520px, 177cqw, 691px);
    overflow: hidden;
    border: 1px solid #4c315c;
    border-radius: 24px;
    background: var(--im-background);
    color: var(--im-text);
    box-shadow: 0 14px 35px #10091e24;
  }
  #yaloka-im-demo .im-phone::before {
    position: absolute;
    z-index: -1;
    inset: 0 0 auto;
    height: 160px;
    content: "";
    background: radial-gradient(ellipse at 74% 0%, #65317a 0%, #3b1d4e 39%, transparent 77%);
  }
  #yaloka-im-demo .im-phone:has(.im-detail:not([hidden], .im-immersive)) {
    background: #160d22;
  }
  #yaloka-im-demo .im-phone:has(.im-detail:not([hidden], .im-immersive))::before,
  #yaloka-im-demo .im-phone:has(.im-detail:not([hidden], .im-immersive)) .im-scenery {
    display: none;
  }
  #yaloka-im-demo .im-scenery {
    position: absolute;
    z-index: -1;
    pointer-events: none;
    top: 0;
    right: 0;
    width: 76%;
    height: 93px;
    background: var(--im-atlas) right top / 169% auto no-repeat;
    background-position-y: max(-39px, -10cqw);
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 47%), linear-gradient(#000 13%, transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0%, #000 47%), linear-gradient(#000 13%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-composite: intersect;
    opacity: .72;
  }
  #yaloka-im-demo .im-status {
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 19px 0;
    font-size: 13px;
    font-weight: 700;
  }
  #yaloka-im-demo .im-status-icons { display: flex; align-items: center; gap: 5px; }
  #yaloka-im-demo .im-status-icons svg { width: 14px; height: 14px; }
  #yaloka-im-demo .im-battery {
    border-radius: 5px;
    padding: 1px 4px;
    background: #f9edf9;
    color: #301d42;
    font-size: 10px;
  }
  #yaloka-im-demo .im-main, #yaloka-im-demo .im-detail {
    display: grid;
    min-height: 0;
    grid-template-rows: auto minmax(0, 1fr) auto;
  }
  #yaloka-im-demo .im-tabs { display: flex; align-items: center; gap: clamp(12px, 4.8cqw, 20px); padding: 4px 16px 3px; }
  #yaloka-im-demo .im-tab {
    position: relative;
    min-height: 44px;
    color: #d0bfd9;
    font-size: clamp(17px, 5.1cqw, 20px);
    white-space: nowrap;
  }
  #yaloka-im-demo .im-tab[aria-selected="true"] {
    color: var(--im-text);
    font-weight: 750;
    text-shadow: 0 7px 16px #a64affab;
  }
  #yaloka-im-demo .im-tab[aria-selected="true"]::after {
    position: absolute;
    bottom: 4px;
    left: calc(50% - 8px);
    width: 16px;
    height: 3px;
    border-radius: 3px;
    background: var(--im-purple);
    content: "";
  }
  #yaloka-im-demo .im-panel { min-height: 0; overflow: auto; scrollbar-width: none; overscroll-behavior: contain; }
  #yaloka-im-demo .im-panel::-webkit-scrollbar { display: none; }
  #yaloka-im-demo .im-search {
    display: flex;
    align-items: center;
    gap: 9px;
    height: 40px;
    margin: 7px 15px 9px;
    padding: 0 12px;
    border: 1px solid #e5d5f526;
    border-radius: 999px;

<script>
(() => {
  const root = document.getElementById("yaloka-im-demo");
  const main = root.querySelector(".im-main");
  const tabs = [...root.querySelectorAll('[role="tab"]')];
  const messageList = root.querySelector(".im-message-list");
  const contactsList = root.querySelector(".im-contacts-list");
  const search = root.querySelector(".im-search input");
  const eventsList = root.querySelector(".im-events");
  const emptyEvents = root.querySelector(".im-no-events");
  const detail = root.querySelector(".im-detail");
  const detailHeader = root.querySelector(".im-detail-header");
  const detailContent = root.querySelector(".im-detail-content");
  const back = root.querySelector(".im-back");
  const emptySwitch = root.querySelector("#im-demo-no-events");
  const emptyNoticesSwitch = root.querySelector("#im-demo-no-notices");

  const demoTime = "2026-11-26T12:55:00+05:00";
  const events = [
    { id: "christmas", name: "Christmas Gift Hunt", start: "2026-11-26T12:00:00+05:00", end: "2026-12-25T23:59:59+05:00",
      art: "christmas", visible: true, summary: "Collect festive gifts during the event." },
    { id: "invitation", name: "Invitation New Hosts Rewards", start: "2026-11-24T10:00:00+05:00", end: "2026-12-06T23:59:59+05:00",
      art: "invitation", visible: true, summary: "Invite new hosts to take part in the event." },
    { id: "love", name: "CP Love Festival", start: "2026-11-23T10:00:00+05:00", end: "2026-12-02T23:59:59+05:00",
      art: "love", visible: true, summary: "Send event gifts to celebrate with your partner." },
    { id: "rush", name: "Lucky Gift Rush", start: "2026-11-19T10:00:00+05:00", end: "2026-11-25T18:00:00+05:00",
      art: "chest", visible: true, summary: "Your reward of 500 Coins has been credited." },
  ];
  const notices = [
    { kind: "banner", event: "christmas", title: "Event started", at: "2026-11-26T12:00:00+05:00",
      line: "Christmas Gift Hunt is now live.", action: "View event", unread: true },
    { kind: "text", event: "rush", title: "You won a reward", at: "2026-11-25T18:30:00+05:00",
      line: "Your Lucky Gift Rush reward of 500 Coins has been credited.", action: "Click to view", unread: true },
    { kind: "banner", event: "rush", title: "Event ended", at: "2026-11-25T18:00:00+05:00",
      line: "Lucky Gift Rush has ended.", unread: false },
    { kind: "text", title: "You won a reward", at: "2026-11-24T16:00:00+05:00",
      line: "Your CP Love Festival reward of 200 Coins has been credited.", unread: false },
  ];
  const samplePeople = [
    { name: "Lucas", avatarY: 37.5, date: "11/06 16:30" },
    { name: "Irfan Khan", avatarY: 47, date: "11/04 16:53" },
    { name: "FAVI", avatarY: 56.5, date: "10/30 18:26" },
    { name: "Faizan6775", avatarY: 66.1, date: "09/26 11:12" },
    { name: "Md badsha", avatarY: 75.6, date: "09/23 22:05" },
  ];
  const pages = [];
  let unread = notices.filter(notice => notice.unread).length;

  function fullTime(date) {
    return date.slice(0, 16).replace("T", " ") + " (UTC+5)";
  }

  function shortTime(date) {
    return date.slice(5, 16).replace("-", "/").replace("T", " ");
  }

  function live(event) {
    return event.visible && Date.parse(event.start) <= Date.parse(demoTime) && Date.parse(demoTime) < Date.parse(event.end);
  }

  function avatar(avatarY) {
    return `<span class="im-avatar" style="--im-avatar-y:${avatarY}%" aria-hidden="true"></span>`;
  }

  function rowCopy(name, subtitle = "", date = "", official = false) {
    return `<div class="im-row-copy">
      <div class="im-row-line"><span class="im-row-name">${name}</span>${official ? '<span class="im-official">Official</span>' : ""}
      ${date ? `<time>${date}</time>` : ""}</div>
      ${subtitle ? `<p class="im-row-subtitle">${subtitle}</p>` : ""}
    </div>`;
  }

  function renderMessages() {
    const latest = emptyNoticesSwitch.checked ? undefined : notices[0];
    const visibleUnread = latest ? unread : 0;
    messageList.innerHTML = `
      <li class="im-row" data-name="Yaloka Team">${avatar(18.5)}
        ${rowCopy("Yaloka Team", "Last week's settlement is complete.", "11/23 10:59", true)}</li>
      <li data-name="Event Notices">
        <button type="button" class="im-row cursor-interaction" data-open-notices
          aria-label="Event Notices${visibleUnread ? `, ${visibleUnread} unread messages` : ""}">
          <span class="im-avatar im-avatar-event" aria-hidden="true">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6a13 13 0 0 0 8.4-2.8A1 1 0 0 1 21 4v12a1 1 0 0 1-1.6.8A13 13 0 0 0 11 14H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><path d="M6 14a12 12 0 0 0 2.4 7.2 2 2 0 0 0 3.2-2.4A8 8 0 0 1 10 14"/><path d="M8 6v8"/></svg>${visibleUnread ? `<span class="im-unread">${visibleUnread}</span>` : ""}
          </span>
          ${rowCopy("Event Notices", latest?.line, latest ? shortTime(latest.at) : "", true)}
        </button>
      </li>
      <li class="im-row" data-name="Strangers">${avatar(28)}${rowCopy("Strangers")}</li>
      ${samplePeople.map(person => `<li class="im-row" data-name="${person.name}">${avatar(person.avatarY)}
        ${rowCopy(person.name, "Followed you! Hope for a follow back~", person.date)}</li>`).join("")}`;
    filterMessages();
  }

  function filterMessages() {
    const query = search.value.trim().toLowerCase();
    const rows = [...messageList.children];
    for (const row of rows) row.hidden = !row.dataset.name.toLowerCase().includes(query);
    root.querySelector(".im-no-conversations").hidden = rows.some(row => !row.hidden);
  }

  function bannerMarkup(event) {
    return `<span class="im-banner im-banner-${event.art}">
      ${event.art === "invitation" ? "" : `<span class="im-banner-wordmark">${event.name}</span>`}
    </span>`;
  }

  function renderEvents() {
    const ongoing = emptySwitch.checked ? [] : events.filter(live);
    eventsList.hidden = ongoing.length === 0;
    emptyEvents.hidden = ongoing.length > 0;
    eventsList.innerHTML = ongoing.map(event => `
      <article class="im-event">
        <button class="im-event-card cursor-interaction" type="button" data-event="${event.id}"
          aria-label="${event.name}" aria-describedby="im-start-${event.id}">
          ${bannerMarkup(event)}
          <span class="im-event-date" id="im-start-${event.id}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            <span>Start time <time datetime="${event.start}">${fullTime(event.start)}</time></span>
          </span>
        </button>
      </article>`).join("");
  }

  function selectTab(tab) {
    for (const item of tabs) {
      const selected = item === tab;
      item.setAttribute("aria-selected", String(selected));
      item.tabIndex = selected ? 0 : -1;
      document.getElementById(item.getAttribute("aria-controls")).hidden = !selected;
    }
  }

  function renderNotice(notice) {
    const arrow = '<span class="im-notice-arrow" aria-hidden="true"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>';
    const avatar = '<span class="im-avatar im-avatar-event" aria-hidden="true"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6a13 13 0 0 0 8.4-2.8A1 1 0 0 1 21 4v12a1 1 0 0 1-1.6.8A13 13 0 0 0 11 14H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><path d="M6 14a12 12 0 0 0 2.4 7.2 2 2 0 0 0 3.2-2.4A8 8 0 0 1 10 14"/><path d="M8 6v8"/></svg></span>';
    let message;
    if (notice.kind === "banner") {
      const event = events.find(item => item.id === notice.event);
      const content = `${bannerMarkup(event)}
        <span class="im-notice-footer">
          <span class="im-notice-type">${notice.title}</span>
          ${notice.action ? `<span class="im-notice-action">${notice.action}${arrow}</span>` : ""}
        </span>`;
      message = notice.action ? `<button class="im-notice-body im-notice-banner cursor-interaction" type="button" data-event="${event.id}"
        aria-label="${notice.action} · ${notice.title} · ${event.name}">${content}</button>`
        : `<div class="im-notice-body im-notice-banner">${content}</div>`;
    } else {
      message = `<div class="im-notice-body">
        <p class="im-notice-copy">${notice.line}</p>
        ${notice.action ? `<button class="im-notice-link cursor-interaction" type="button" data-event="${notice.event}"
          aria-label="${notice.action} · ${notice.title}">${notice.action}${arrow}</button>` : ""}
      </div>`;
    }
    return `<article class="im-notice" aria-label="${notice.title}">
      <time datetime="${notice.at}">${shortTime(notice.at)}</time>
      <div class="im-notice-row">${avatar}${message}</div>
    </article>`;
  }

  function showPage(page) {
    const event = page.event;
    main.hidden = true;
    detail.hidden = false;
    detail.classList.toggle("im-immersive", Boolean(event));
    for (const child of detailHeader.children) child.hidden = Boolean(event) && child !== back;
    detail.setAttribute("aria-label", event ? event.name : "Event Notices");
    if (event) {
      const ongoing = live(event);
      detailContent.innerHTML = `
        <div class="im-event-hero im-banner-${event.art}">
          <h2 ${event.art === "invitation" ? 'style="position:absolute;clip-path:inset(50%)"' : ""}>${event.name}</h2>
        </div>
        <div class="im-event-info">
          <h3>${ongoing ? "Event time" : "Event result"}</h3>
          <p>${ongoing ? `Starts <time datetime="${event.start}">${fullTime(event.start)}</time>` : "This event has ended."}</p>
          <p>${event.summary}</p>
        </div>`;
    } else if (emptyNoticesSwitch.checked) {
      detailContent.innerHTML = '<p class="im-empty" role="status">No event notices</p>';
    } else {
      unread = 0;
      detailContent.innerHTML = `<div class="im-notices">${notices.map(renderNotice).join("")}</div>`;
    }
    detailContent.scrollTop = page.scroll ?? 0;
  }

  function openPage(page, trigger) {
    const previous = pages.at(-1);
    page.returnSelector = trigger.hasAttribute("data-open-notices")
      ? "[data-open-notices]" : `[data-event="${trigger.dataset.event}"]`;
    if (previous) {
      previous.scroll = detailContent.scrollTop;
      page.returnIndex = [...detailContent.querySelectorAll(page.returnSelector)].indexOf(trigger);
    }
    pages.push(page);
    showPage(page);
    back.focus({ preventScroll: true });
  }

  function goBack() {
    const page = pages.pop();
    if (!page) return;
    const previous = pages.at(-1);
    if (previous) {
      showPage(previous);
      detailContent.querySelectorAll(page.returnSelector)[page.returnIndex]?.focus({ preventScroll: true });
    } else {
      detail.hidden = true;
      main.hidden = false;
      (main.querySelector(page.returnSelector) ?? root.querySelector('[aria-selected="true"]'))?.focus({ preventScroll: true });
    }
  }

  for (const tab of tabs) {
    tab.addEventListener("click", () => selectTab(tab));
    tab.addEventListener("keydown", event => {
      const tabIndex = tabs.indexOf(tab);
      const offset = { ArrowLeft: -1, ArrowRight: 1 }[event.key];
      if (!offset && event.key !== "Home" && event.key !== "End") return;
      event.preventDefault();
      const next = tabs[event.key === "Home" ? 0 : event.key === "End" ? tabs.length - 1 :
        (tabIndex + offset + tabs.length) % tabs.length];
      selectTab(next);
      next.focus();
    });
  }

  root.addEventListener("click", event => {
    const trigger = event.target.closest("button");
    if (!trigger) return;
    if (trigger.hasAttribute("data-open-notices")) {
      openPage({}, trigger);
      renderMessages();
    } else if (trigger.dataset.event) {
      const selectedEvent = events.find(item => item.id === trigger.dataset.event);
      if (selectedEvent) openPage({ event: selectedEvent }, trigger);
    } else if (trigger === back) {
      goBack();
    }
  });
  root.addEventListener("keydown", event => {
    if (event.key === "Escape" && pages.length) goBack();
  });
  search.addEventListener("input", filterMessages);
  emptySwitch.addEventListener("change", () => {
    renderEvents();
    if (!pages.length) selectTab(tabs[2]);
  });
  emptyNoticesSwitch.addEventListener("change", () => {
    const currentPage = pages.at(-1);
    if (!currentPage) selectTab(tabs[0]);
    else if (!currentPage.event) showPage(currentPage);
    renderMessages();
  });

  contactsList.innerHTML = samplePeople.map(person =>
    `<li class="im-row">${avatar(person.avatarY)}${rowCopy(person.name)}</li>`).join("");
  renderMessages();
  renderEvents();
})();
</script>
</body>
</html>
