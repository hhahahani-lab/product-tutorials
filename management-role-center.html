function selectedTeamWeek(){return {range:naturalWeekRange(state.teamWeekStart),factor:naturalWeekFactor(state.teamWeekStart),isCurrent:naturalWeekDiff(state.teamWeekStart)===0}}
function weeklyMemberMetric(m,key){const w=selectedTeamWeek(),f=w.factor;if(w.isCurrent)return Number(m[key]||0);const roleOffset=m.role==='Super Admin'?1.02:m.role==='Admin'?.98:m.role==='BD'?1.04:.96;const factor=Math.max(.55,Math.min(1.15,f*roleOffset));if(key==='validHours')return Math.round(Number(m[key]||0)*factor*10)/10;return Math.max(0,Math.round(Number(m[key]||0)*factor))}
function applyManagerTeamWeek(startIso){state.teamWeekStart=startIso;render()}
function memberRoleMetricRows(m){
 const base=[['Coins',fmt(weeklyMemberMetric(m,'gold'))],['Diamonds',fmt(weeklyMemberMetric(m,'diamonds'))]];
 if(m.role==='Super Admin'||m.role==='Admin')return [...base,['New Agency',weeklyMemberMetric(m,'newAgency')],['New Hosts',weeklyMemberMetric(m,'newHosts')]];
 if(m.role==='BD')return [...base,['New Agency',weeklyMemberMetric(m,'newAgency')],['New Hosts',weeklyMemberMetric(m,'newHosts')],['Active Hosts',weeklyMemberMetric(m,'voice')],['Gifted Hosts',weeklyMemberMetric(m,'hostDiamonds')]];
 return [...base,['New Hosts',weeklyMemberMetric(m,'newHosts')],['Active Hosts',weeklyMemberMetric(m,'voice')],['Gifted Hosts',weeklyMemberMetric(m,'hostDiamonds')],['Effective Hosts',weeklyMemberMetric(m,'effectiveHosts')]];
}
function memberRoleMetrics(m,cls=''){const rows=memberRoleMetricRows(m);return `<div class="compactMetricGrid ${cls}">${rows.map(([label,value])=>`<div class="compactMetric"><b>${value}</b><span>${label}</span></div>`).join('')}</div>`}
function memberTeamOverviewRows(m){
 const descendants=managementDescendants(m);
 if(m.role==='Super Admin')return [['Admin',descendants.filter(x=>x.role==='Admin').length],['BD',descendants.filter(x=>x.role==='BD').length],['Agency',m.agencyCount],['Hosts',m.hosts]];
 if(m.role==='Admin')return [['BD',descendants.filter(x=>x.role==='BD').length],['Agency',m.agencyCount],['Hosts',m.hosts],['Effective Hosts',m.effectiveHosts]];
 if(m.role==='BD')return [['Agency',m.agencyCount],['Hosts',m.hosts]];
 return [['Hosts',m.hosts],['Effective Hosts',m.effectiveHosts]];
}
function memberTeamOverview(m){const rows=memberTeamOverviewRows(m);return `<div class="teamOverviewInline"><div class="teamOverviewLabel"><b>Team Overview</b><span>Current</span></div><div class="teamOverviewMini">${rows.map(([label,value])=>`<button onclick="openTeamOverview(${m.id},'${label}')"><b>${value}</b><span>${label}</span><i>›</i></button>`).join('')}</div></div>`}

let analysisFilter={time:'This Week',sort:'Coins',value:'Total Value',order:'Descending'};
const analysisMetricMap={
 'Coins':{field:'coins',gap:'coinsGap',unit:'number'},
 'Valid Hours':{field:'validHours',gap:'validHoursGap',unit:'hours'},
 'Host':{field:'hosts',gap:'hostsGap',unit:'number'},
 'Active Hosts':{field:'active',gap:'activeGap',unit:'number'},
 'Gifted Hosts':{field:'gifted',gap:'giftedGap',unit:'number'},
 'New Hosts':{field:'newHosts',gap:'newHostsGap',unit:'number'}
};
function analysisSnapshot(a){return analysisFilter.time==='Yesterday'?a.analysis.yesterday:a.analysis.week}
function analysisMetricValue(v,unit){if(v===undefined||v===null)return '—';return unit==='hours'?`${Number(v).toLocaleString(undefined,{maximumFractionDigits:1})}h`:fmt(Math.round(Number(v)))}
function analysisGrowthRate(total,gap){const prev=Number(total)-Number(gap);return prev?Number(gap)/prev*100:null}
function analysisMetricResult(a){const spec=analysisMetricMap[analysisFilter.sort],snap=analysisSnapshot(a);if(!spec||snap[spec.field]===undefined)return {raw:0,value:'—',sub:analysisFilter.sort,tone:''};const total=Number(snap[spec.field]);if(analysisFilter.time!=='Yesterday'||analysisFilter.value==='Total Value')return {raw:total,value:analysisMetricValue(total,spec.unit),sub:analysisFilter.sort,tone:''};const gap=Number(snap[spec.gap]||0);if(analysisFilter.value==='Growth Value')return {raw:gap,value:`${gap>0?'+':''}${analysisMetricValue(gap,spec.unit)}`,sub:'Growth Value',tone:gap>0?'pos':gap<0?'neg':''};const rate=analysisGrowthRate(total,gap);if(rate===null)return {raw:0,value:'—',sub:'Growth Rate',tone:''};return {raw:rate,value:`${rate>0?'+':''}${rate.toFixed(1)}%`,sub:'Growth Rate',tone:rate>0?'pos':rate<0?'neg':''}}
function analysisCandidateList(kind){let list=kind==='team'?analysisLists.team:analysisLists.agency;if(kind==='team')list=list.filter(a=>state.analysisTeamFilter==='All'||a.linkedRole===state.analysisTeamFilter);const q=state.analysisQuery.trim().toLowerCase();if(q)list=list.filter(a=>`${a.name} ${a.userId} ${a.uid} ${a.code}`.toLowerCase().includes(q));return [...list].sort((a,b)=>analysisFilter.order==='Descending'?analysisMetricResult(b).raw-analysisMetricResult(a).raw:analysisMetricResult(a).raw-analysisMetricResult(b).raw)}

function chart(values=[20119300,18750000,17960000],unit='',label='Coins'){const raw=values.map(Number),vals=[raw[2],raw[1],raw[0]],labels=['Two Weeks Ago','Last Week','This Week'],max=Math.max(...vals,1),min=Math.min(...vals,0),range=Math.max(max-min,1),xs=[34,170,306],ys=vals.map(v=>128-((v-min)/range)*94),pts=vals.map((v,i)=>`${xs[i]},${ys[i]}`).join(' '),format=v=>unit==='h'?`${Number(v).toLocaleString(undefined,{maximumFractionDigits:1})}h`:fmt(Math.round(Number(v)));return `<div class="panelCard chartCard"><div class="chart"><svg viewBox="0 0 340 150" preserveAspectRatio="none"><path class="gridline" d="M0 30H340M0 60H340M0 90H340M0 120H340"/>${xs.map(x=>`<path class="chartGuide" d="M${x} 16V132"/>`).join('')}<polyline class="lineA" points="${pts}"/>${xs.map((x,i)=>`<circle class="chartPoint" cx="${x}" cy="${ys[i]}" r="5"/>`).join('')}</svg></div><div class="chartLegend"><span><i></i>${label} · 3-week comparison</span></div><div class="chartWeeks">${vals.map((v,i)=>`<div class="chartWeek ${i===2?'current':''}"><b>${format(v)}</b><span>${labels[i]}</span></div>`).join('')}</div></div>`}
function renderAnalysis(){const tabs=[['total','Total Data'],['agency','My Agency'],['team','Team Agency']];let body='';if(state.analysisTab==='total'){const t=totalAnalysisScope();body=`<div class="dataCaption"><strong>This Week's Data</strong> · Total Team = My Agency + Team Agency · same Agency counted once.</div><div class="panelCard analysisOrgGrid"><div><b>11</b><span>Management Team</span><small>2 Super Admin · 3 Admin · 6 BD</small></div><div><b>30</b><span>Agency</span><small>3 My Agency · 27 Team Agency</small></div><div><b>236</b><span>Host</span><small>All agencies, deduplicated</small></div></div><div class="sectionHead"><b>Production Data</b></div><div class="panelCard analysisProductionGrid"><div><b>20,119,300</b><span>Coins</span><small>My Agency + Team Agency</small></div><div><b>1,070.0h</b><span>Valid Hours</span><small>This week's data</small></div><div><b>23</b><span>New Hosts</span><small>This week's data</small></div><div><b>184</b><span>Effective Hosts</span><small>4 Effective Days + 10 Valid Working Hours</small></div><div><b>199</b><span>Active Hosts</span><small>Voice time &gt; 0</small></div><div><b>177</b><span>Gifted Hosts</span><small>Diamonds &gt; 0</small></div></div><div class="sectionHead analysisCompareHead"><b>Data comparison</b><button onclick="openAnalysisTrend('total')">Details ›</button></div>${chart(t.analysis.trend.coins,'','Coins')}`}
 else if(state.analysisTab==='agency'){body=`<div class="dataCaption"><strong>My Agency</strong> · Agencies directly managed by the current Manager · excludes today.</div>${analysisListMarkup('agency')}`}

function trendData(){const s=state.analysisSelected||totalAnalysisScope(),trend=s.analysis?.trend||totalAnalysisScope().analysis.trend;const map={coins:{label:'Coins',values:trend.coins,unit:''},valid:{label:'Valid Hours',values:trend.valid,unit:'h'},active:{label:'Active Hosts',values:trend.active,unit:''},gifted:{label:'Gifted Hosts',values:trend.gifted,unit:''}};return {s,...map[state.trendMetric]}}

function renderTrend(){const d=trendData(),metrics=[['coins','Coins'],['valid','Valid Hours'],['active','Active Hosts'],['gifted','Gifted Hosts']];return `<section class="page"><div class="panelCard trendScopeCard"><span>Analysis Scope</span><b>${d.s.name}</b><small>${d.s.scope==='total'?'My Agency + Team Agency':'Single Agency'}</small></div><div class="pageTabs">${metrics.map(([k,l])=>`<button class="${state.trendMetric===k?'active':''}" onclick="state.trendMetric='${k}';render()">${l}</button>`).join('')}</div><div class="dataCaption">Last 3 completed/current weekly views · selected scope only</div>${chart(d.values,d.unit,d.label)}<p class="trendMetricNote">Effective Hosts is a settlement-period qualification metric, so it stays in weekly summaries and is not plotted as a daily/trend metric.</p></section>`}
function renderRules(){return `<section class="page"><div class="panelCard" style="padding:16px"><b style="color:#f2d071;font-size:13px">Data Analysis Rules</b><p style="font-size:10px;line-height:1.65;color:#b8aabd">1. My Agency = Agencies directly managed by the current Manager.<br>2. Team Agency = Agencies reached through the Manager's directly linked Super Admin / Admin / BD branches; the first-level branch is used as the Team Agency filter.<br>3. Total Data = My Agency + Team Agency, with the same underlying Agency counted once only.<br>4. Management Team = Super Admin, Admin and BD members within the Manager's management scope.<br>5. Agency = Total number of Agencies in the selected scope, counted once only.<br>6. Host = Total number of Hosts under those Agencies.<br>7. Coins = Gift Coins received by Hosts in the selected period.<br>8. Valid Hours = Total valid on-mic time of Hosts in the selected period.<br>9. New Hosts = Hosts newly added during the selected period.<br>10. Effective Hosts = Hosts who complete at least 4 Effective Days and 10 Valid Working Hours in the settlement period.<br>11. Active Hosts = Hosts with on-mic time greater than 0.<br>12. Gifted Hosts = Hosts who received more than 0 diamonds.<br>13. Agency list filters support This Week / Yesterday, metric sorting, Total Value and Yesterday growth value/rate, plus ascending/descending order.<br>14. Data Trend compares business production metrics only; salary, Commission, Base and Manager Level remain in Salary Bill.</p></div></section>`}
function reviewCard(r){return `<div class="panelCard reviewCard"><div class="memberHead"><div class="avatar">${r.subject[0]}</div><div class="identity"><b>${r.subject}</b><small>ID ${r.id}</small></div><span class="status ${r.status==='Approval'?'ok':r.status==='Not pass'?'no':''}">${r.status}</span></div><div class="reviewContent">${r.value}</div>${r.status==='Under review'?`<div class="reviewActions"><button class="approve" onclick="setModeration(${r.id},'Approval')">Approve</button><button class="reject" onclick="setModeration(${r.id},'Not pass')">Reject</button></div>`:''}</div>`}

// Unified natural-week picker — Monday to Sunday.
let naturalWeekPickerState={selectedStart:null,viewYear:null,viewMonth:null,applyFn:null};
function naturalWeekParse(iso){const p=String(iso||'').split('-').map(Number);return new Date(p[0]||2026,(p[1]||1)-1,p[2]||1)}
function naturalWeekIso(d){const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
function naturalWeekMonday(d){const x=new Date(d);x.setHours(12,0,0,0);const offset=(x.getDay()+6)%7;x.setDate(x.getDate()-offset);return x}
function naturalWeekAdd(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function naturalWeekCurrentStart(){return naturalWeekIso(naturalWeekMonday(new Date()))}
function naturalWeekRange(startIso){const s=naturalWeekParse(startIso),e=naturalWeekAdd(s,6);return `${naturalWeekIso(s)} ~ ${naturalWeekIso(e)}`}
function naturalWeekDiff(startIso){const cur=naturalWeekMonday(new Date()),sel=naturalWeekMonday(naturalWeekParse(startIso));return Math.round((cur-sel)/604800000)}
function naturalWeekFactor(startIso){const n=naturalWeekDiff(startIso);if(n<=0)return 1;const presets=[1,.91,.84,.78];return presets[n]||Math.max(.55,1-n*.06)}
function naturalWeekPeriodLabel(startIso){const n=naturalWeekDiff(startIso);if(n===0)return 'This Week';if(n===1)return 'Last Week';if(n===2)return 'Two Weeks Ago';return naturalWeekRange(startIso)}
function ensureNaturalWeekOverlay(){if(document.getElementById('naturalWeekOverlay'))return;const o=document.createElement('div');o.id='naturalWeekOverlay';o.className='naturalWeekOverlay';o.onclick=e=>{if(e.target===o)closeNaturalWeekPicker()};o.innerHTML=`<div class="naturalWeekPanel" onclick="event.stopPropagation()"><div class="naturalWeekHandle"></div><div class="naturalWeekTitleRow"><span></span><b>Select Week</b><button onclick="closeNaturalWeekPicker()">×</button></div><div class="naturalWeekNav"><button onclick="shiftNaturalWeekYear(-1)">«</button><button onclick="shiftNaturalWeekMonth(-1)">‹</button><b id="naturalWeekMonthLabel"></b><button onclick="shiftNaturalWeekMonth(1)">›</button><button onclick="shiftNaturalWeekYear(1)">»</button></div><div class="naturalWeekDays"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div><div id="naturalWeekGrid" class="naturalWeekGrid"></div><div id="naturalWeekSelected" class="naturalWeekSelected"></div><div class="naturalWeekQuick"><button onclick="pickNaturalThisWeek()">This Week</button></div><div class="naturalWeekActions"><button onclick="closeNaturalWeekPicker()">Cancel</button><button class="confirm" onclick="confirmNaturalWeekPicker()">Confirm</button></div></div>`;document.body.appendChild(o)}
function openNaturalWeekPicker(startIso,applyFn){ensureNaturalWeekOverlay();const s=naturalWeekMonday(naturalWeekParse(startIso||naturalWeekCurrentStart()));naturalWeekPickerState.selectedStart=naturalWeekIso(s);naturalWeekPickerState.viewYear=s.getFullYear();naturalWeekPickerState.viewMonth=s.getMonth();naturalWeekPickerState.applyFn=applyFn;renderNaturalWeekCalendar();document.getElementById('naturalWeekOverlay').classList.add('show')}
function closeNaturalWeekPicker(){document.getElementById('naturalWeekOverlay')?.classList.remove('show')}
function shiftNaturalWeekMonth(delta){let y=naturalWeekPickerState.viewYear,m=naturalWeekPickerState.viewMonth+delta;const d=new Date(y,m,1);naturalWeekPickerState.viewYear=d.getFullYear();naturalWeekPickerState.viewMonth=d.getMonth();renderNaturalWeekCalendar()}
function shiftNaturalWeekYear(delta){naturalWeekPickerState.viewYear+=delta;renderNaturalWeekCalendar()}
function pickNaturalWeekDate(iso){naturalWeekPickerState.selectedStart=naturalWeekIso(naturalWeekMonday(naturalWeekParse(iso)));renderNaturalWeekCalendar()}
function pickNaturalThisWeek(){const s=naturalWeekMonday(new Date());naturalWeekPickerState.selectedStart=naturalWeekIso(s);naturalWeekPickerState.viewYear=s.getFullYear();naturalWeekPickerState.viewMonth=s.getMonth();renderNaturalWeekCalendar()}
function renderNaturalWeekCalendar(){ensureNaturalWeekOverlay();const y=naturalWeekPickerState.viewYear,m=naturalWeekPickerState.viewMonth;document.getElementById('naturalWeekMonthLabel').textContent=new Date(y,m,1).toLocaleString('en-US',{month:'short',year:'numeric'});const first=new Date(y,m,1),gridStart=naturalWeekMonday(first),selected=naturalWeekParse(naturalWeekPickerState.selectedStart),selectedEnd=naturalWeekAdd(selected,6),todayIso=naturalWeekIso(new Date());let html='';for(let i=0;i<42;i++){const d=naturalWeekAdd(gridStart,i),iso=naturalWeekIso(d),selectedEndIso=naturalWeekIso(selectedEnd),inWeek=iso>=naturalWeekPickerState.selectedStart&&iso<=selectedEndIso,cls=['naturalWeekDay'];if(d.getMonth()!==m)cls.push('outside');if(inWeek)cls.push('inWeek');if(iso===naturalWeekPickerState.selectedStart)cls.push('weekStart');if(iso===naturalWeekIso(selectedEnd))cls.push('weekEnd');if(iso===todayIso)cls.push('today');html+=`<button class="${cls.join(' ')}" onclick="pickNaturalWeekDate('${iso}')">${d.getDate()}</button>`}document.getElementById('naturalWeekGrid').innerHTML=html;document.getElementById('naturalWeekSelected').innerHTML=`Selected week · <b>${naturalWeekRange(naturalWeekPickerState.selectedStart)}</b>`}
function confirmNaturalWeekPicker(){const fn=window[naturalWeekPickerState.applyFn];if(typeof fn==='function')fn(naturalWeekPickerState.selectedStart);closeNaturalWeekPicker()}

.financeBreakdown{margin:0 14px 14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025);font-size:12px;line-height:1.5}.financeLine{display:flex;justify-content:space-between;gap:14px;margin:6px 0}.financeLine span{color:#b8aabd}.financeLine b{white-space:nowrap;color:#eee3f1}.financeReason{margin:5px 0 10px;color:#b8aabd;white-space:pre-wrap;overflow-wrap:anywhere}.financeLine .minus{color:#ffabae}.financeLine .plus{color:#9bdfb5}.financeFinal{border-top:1px solid var(--line);padding-top:10px}.financeFinal b{color:#f2d071}.salaryDataNote{font-size:11px}.sourceWeekBody .weekGrid span{font-size:11px}.sourceWeekBody .weekGrid b{font-size:12px}.financeDemoNote{font-size:10px;color:#a99cad;margin:8px 2px 14px}.sourceWeekBody .deductionNote{font-size:11px}
</style>
<script id="published-finance-salary">
// Published fixture amounts retain the existing Commission, Base and finance adjustments.
const financeRoleBills = {};
const financeMoney = amount => '$' + Number(amount).toFixed(2);
const financeEscape = value => String(value ?? '').replace(/[&<>"']/g, character => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[character]));
const financeSigned = amount => (amount < 0 ? '−' : '+') + financeMoney(Math.abs(amount));

function financeBills() {
  const role = demoConfig().role;
  if (!financeRoleBills[role]) {
    financeRoleBills[role] = managerMonthBills.map((bill, billIndex) => {
      const source = role === 'BD' ? bdWeeks : managerWeeks;
      const periodStart = new Date(bill.end + 'T00:00:00Z');
      periodStart.setUTCDate(periodStart.getUTCDate() - 27);
      const weeks = source.map((week, weekIndex) => {
        const start = new Date(periodStart);
        start.setUTCDate(start.getUTCDate() + weekIndex * 7);
        const end = new Date(start);
        end.setUTCDate(end.getUTCDate() + 6);
        return {
          ...week,
          role: week.role || role,
          week: weekIndex + 1,
          start: start.toISOString().slice(0, 10),
          end: end.toISOString().slice(0, 10),
          adj: billIndex === 0 ? (weekIndex === 0 ? -20 : weekIndex === 1 ? 10 : 0) : 0,
          reason: weekIndex === 0
            ? 'Deduction for a verified policy violation.'
            : 'Correction of an underpaid salary amount.'
        };
      });
      const subtotal = weeks.reduce((sum, week) => sum + Math.round(week.commission * 100)
        + Math.round(week.basic * 100) + Math.round(week.adj * 100), 0) / 100;
      const adjustment = billIndex === 0 ? -5 : 0;
      return {
        ...bill, start: periodStart.toISOString().slice(0, 10), weeks, subtotal,
        adj: adjustment,
        reason: 'Correction of an overpayment from the previous payout cycle.',
        total: (Math.round(subtotal * 100) + Math.round(adjustment * 100)) / 100,
        published: true
      };
    });
  }
  return financeRoleBills[role];
}

function financeDetail(base, adjustment, reason, final, label = 'Original Salary', adjustmentLabel = 'Adjustment', showBase = true) {
  if (!adjustment) return '';
  return `<div class="financeBreakdown">
    ${showBase ? `<div class="financeLine"><span>${label}</span><b>${financeMoney(base)}</b></div>` : ''}
    <details class="financeAdjustment"><summary><span>${adjustmentLabel}<i aria-hidden="true">⌄</i></span>
      <b class="${adjustment < 0 ? 'minus' : 'plus'}">${financeSigned(adjustment)}</b></summary>
      <div class="financeReason">${financeEscape(reason || 'Please contact support for details.')}</div>
    </details>
  </div>`;
}

managerSalaryBillsMarkup = function () {
  return financeBills().filter(bill => bill.published).map(bill => {
    const coins = bill.total > 0 && bill.total < 10;
    return `<article class="salaryCard">
      <div class="salaryHead"><span><b>${bill.start} – ${bill.end}</b><small>Payout cycle · 4 weeks</small></span>
        <span class="statusPill ${managerSettlementClass(bill.settlement)}">${({1: 'Pending Confirmation', 2: 'Confirmed', 3: 'Rejected', 4: 'Paid'})[bill.settlement]}</span></div>
      ${financeDetail(bill.subtotal, bill.adj, bill.reason, bill.total)}
      <div class="salaryAmount"><span>Settlement Amount</span><b>${financeMoney(bill.total)}</b></div>
      <div class="salaryMeta sourceSalaryMeta">
        <div><b>${coins ? 'Coins' : managerPayName(bill.payeeType)}</b><span>Payment</span></div>
        <div><b>${coins ? '—' : 'USD'}</b><span>Currency</span></div>
        <div class="wideMeta"><b>${financeEscape(coins ? demoConfig().id : bill.payee)}</b>
          <span>${coins ? 'User ID' : bill.payeeType === 2 ? 'USDT Address' : 'User ID'}</span></div>
      </div>
      <button class="salaryAction" onclick="openWeeklySalary('${bill.start}','${bill.end}')">View Weekly Salary Bill ›</button>
      ${bill.settlement === 1 ? `<div class="sourceBillActions">
        <button class="rejectBill" onclick="updateManagerBill(${bill.id},3)">Reject</button>
        <button class="confirmBill" onclick="confirmManagerBill(${bill.id})">Confirm</button></div>` : ''}
      ${bill.settlement === 4 ? `<div class="sourceBillActions">
        <button onclick="toast('Transfer receipt opened')">Transfer Pic</button>
        <button onclick="toast('Transfer URL copied')">Transfer URL</button></div>` : ''}
    </article>`;
  }).join('');
};

confirmManagerBill = function (id) {
  const bill = financeBills().find(item => item.id === id);
  if (!bill || bill.settlement !== 1) return;
  const coins = bill.total > 0 && bill.total < 10;
  showBillConfirm(`<div class="financeConfirmTotal"><span>Settlement Amount</span><b>${financeMoney(bill.total)}</b></div>
    ${financeDetail(bill.subtotal, bill.adj, bill.reason, bill.total)}
    Payment: ${coins ? 'Coins' : managerPayName(bill.payeeType)}<br>${financeEscape(coins ? demoConfig().id : bill.payee)}`,
    () => updateManagerBill(id, 2));
};

updateManagerBill = function (id, status) {
  const bill = financeBills().find(item => item.id === id);
  if (!bill || bill.settlement !== 1) return;
  bill.settlement = status;
  render();
  toast(status === 2 ? 'Bill confirmed' : 'Bill rejected');
};

function financeMetric(value, label, className = '') {
  return `<div class="${className}"><b>${value}</b><span>${label}</span></div>`;
}

function financeWeeklyMarkup() {
  const bill = financeBills().find(item => item.start === selectedSalaryRange.start && item.end === selectedSalaryRange.end);
  if (!bill) return '<div class="salaryDataNote">No published weekly bills.</div>';
  return bill.weeks.map((week, index) => {
    const percentage = week.required > 0 ? (week.valid / week.required * 100).toFixed(0) + '%' : '—';
    const original = (Math.round(week.commission * 100) + Math.round(week.basic * 100)) / 100;
    const settlement = (Math.round(original * 100) + Math.round(week.adj * 100)) / 100;
    return `<article class="weekCard sourceWeekCard ${index === 0 ? 'open' : ''}" id="week${week.week}">
      <button class="weekCardHead sourceWeekHead" onclick="toggleWeek(${week.week})">
        <span><b>${week.start} – ${week.end}</b><span>Week ${week.week}</span></span><i>⌄</i></button>
      <div class="sourceWeekBody"><div class="weekGrid">
        ${financeMetric('Level ' + week.grade, financeEscape(week.role) + ' Level')}
        ${financeMetric(financeMoney(week.commission), 'Commission')}
        ${financeMetric(financeMoney(week.agency), 'Weekly Agency Salary', 'weeklyAgencyMetric')}
        ${financeMetric(`${week.valid} / ${week.required}<span class="effectiveHostPercent">${percentage}</span>`, 'Effective Hosts')}
        ${financeMetric(financeMoney(week.basic), 'Actual Base Salary')}
      </div>
      ${financeDetail(original, week.adj, week.reason, settlement)}
      <div class="weekSalaryTotal"><span>Settlement Amount</span><b>${financeMoney(settlement)}</b></div>
      <button class="salaryAction" onclick="toast('Agency details download link copied')">Copy Agency Details Download Link</button>
      </div>
    </article>`;
  }).join('');
}
managerWeeklySalaryMarkup = financeWeeklyMarkup;
bdWeeklySalaryMarkup = financeWeeklyMarkup;

renderSalary = function () {
  const preferred = preferredPaymentMethod();
  return `<section class="salaryUnifiedPad">
    <div class="salaryTopAction"><button class="analysisHelpBtn salaryHelp" onclick="openp('salaryRules')" aria-label="Salary rules">?</button></div>
    <div class="salarySectionTitle"><b>Payment Method</b></div>
    <div class="panelCard salaryPaymentCard"><button class="paymentMainRow" onclick="openPaymentMethodSheet()">
      <span class="paymentLogo">${preferred === 'USDT' ? '₮' : '$'}</span>
      <span><b>${preferred || 'Payment method not set'}</b><small>${preferred ? 'Preferred payout method' : 'Tap to complete payout information'}</small></span><i>›</i>
    </button></div>
    <div class="salaryDataNote">All times follow UTC+5.</div>
    <div class="salarySectionTitle"><b>Salary Records</b></div>
    <div class="salaryCards">${managerSalaryBillsMarkup()}</div>
  </section>`;
};

renderWeekSalary = function () {
  return `<section class="page"><div class="weekSalaryTop"><button class="analysisHelpBtn salaryHelp" onclick="openp('salaryRules')" aria-label="Salary rules">?</button></div>
    <div class="panelCard monthRangeCard"><b>${selectedSalaryRange.start} – ${selectedSalaryRange.end}</b><small>Monthly Salary Bill</small></div>
    <div class="salaryDataNote">All times follow UTC+5. Data updates every Wednesday at 00:00.</div>
    ${financeWeeklyMarkup()}
  </section>`;
};

renderSalaryRules = function () {
  return `<section class="page"><div class="panelCard salaryRulesContent"><b>Salary Rules</b>
    <p>Weekly Salary = Commission + Actual Base Salary + Weekly Financial Adjustment.</p>
    <p>Settlement Amount = Sum of adjusted weekly salaries + Monthly Adjustment. Each payout cycle contains 4 weeks. All times follow UTC+5.</p>
    <p>Weekly Agency Salary, level, commission and base assessment follow the existing policy. Effective Hosts completion uses the host count required for the weekly role and level.</p>
    <p>Published bills show actual financial adjustments and expandable reasons. Review the bill and its weekly details before confirming or rejecting it.</p>
    <p>Positive payouts below $10 follow the existing Coins settlement rule at 1 USD = 20,000 Coins.</p>
  </div></section>`;
};
render();
</script>
